<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLEWCHAT</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<style>
  /* INTERFACE FONT: change --font here (one place). The logo/wordmark fonts live in assets/wordmark.svg */
  :root { --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --cyan:#62DDF3; --purple:#8B5CF6; --red:#F05265; --on-cyan:#04202a;
    --bg:#0a1220; --panel:#111c30; --line:#22324d; --text:#eaf3fb; --mute:#9db0c8; --link:#62DDF3; }
  @media (prefers-color-scheme: light) { :root { --bg:#f1f7fb; --panel:#fff; --line:#d3e0ec; --text:#0d1b2a; --mute:#4c607a; --link:#0b6f86; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.45 var(--font); overflow-x: hidden; }
  .hidden { display: none !important; }
  button, input, textarea { font: inherit; color: inherit; }
  input, textarea { width: 100%; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; outline: none; }
  input:focus, textarea:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  textarea { resize: vertical; min-height: 84px; }
  button { cursor: pointer; border: 0; border-radius: 12px; padding: 11px 18px; background: var(--cyan); color: var(--on-cyan); font-weight: 700; }
  button:disabled { opacity: .5; cursor: default; }
  button.alt { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 600; padding: 8px 12px; }
  button.sel { border-color: var(--purple); background: var(--purple); color: #fff; }
  button.danger { color: var(--red); border-color: var(--red); background: transparent; }
  a { color: var(--link); }
  .note { min-height: 1.3em; margin: 10px 0 0; font-size: .92rem; color: var(--mute); }
  .note.err { color: var(--red); }

  #offline { background: var(--red); color: #fff; text-align: center; padding: 6px; font-size: .9rem; }
  #intro { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 24px; text-align: center;
    background: radial-gradient(circle at 50% 30%, #123a52 0%, #0a1220 65%); color: #eaf3fb; }
  #intro img.mark { width: min(46vw, 200px); animation: rise .7s ease-out both; }
  #intro img.word { width: min(78vw, 340px); margin-top: 14px; }
  #intro p { margin: 18px auto 26px; max-width: 22ch; font-size: 1.15rem; border-top: 2px solid var(--purple); padding-top: 14px; }
  #intro button { padding: 14px 28px; font-size: 1.05rem; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.96); } }
  @media (prefers-reduced-motion: reduce) { #intro img.mark { animation: none; } }

  #auth { min-height: 100%; display: grid; place-items: center; padding: 24px; }
  .card { width: 100%; max-width: 380px; }
  .card img { display: block; width: 70%; margin: 0 auto 22px; }
  form.stack { display: grid; gap: 10px; }
  .links { display: flex; justify-content: space-between; margin-top: 12px; font-size: .92rem; }
  .links button { background: none; color: var(--link); padding: 4px; font-weight: 600; }

  #app { height: 100%; display: flex; flex-direction: column; max-width: 720px; margin: 0 auto; }
  header { background: #0a1220; border-bottom: 2px solid var(--purple); display: flex; align-items: center; gap: 8px; padding: 10px 14px; padding-top: calc(10px + env(safe-area-inset-top)); }
  header button.logo { background: none; padding: 0; line-height: 0; border-radius: 6px; }
  header img { height: 26px; }
  header .sp { flex: 1; }
  nav { display: flex; gap: 8px; padding: 10px 14px; }
  nav button { flex: 1; }
  main { flex: 1; overflow-y: auto; padding: 0 14px 14px; padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .meta { font-size: .85rem; color: var(--mute); }
  .meta b { color: var(--text); }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0; }
  .media { position: relative; display: block; width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #000; margin: 8px 0; border: 0; padding: 0; }
  .media img, .media iframe { width: 100%; height: 100%; border: 0; object-fit: cover; }
  .media .play { position: absolute; inset: 0; margin: auto; width: 62px; height: 62px; border-radius: 50%; background: var(--cyan); color: var(--on-cyan); display: grid; place-items: center; font-size: 1.5rem; }
  .empty { text-align: center; color: var(--mute); padding: 28px 10px; }
  .thread { display: flex; flex-direction: column; gap: 8px; }
  .bub { max-width: 82%; padding: 8px 12px; border-radius: 16px 16px 16px 4px; background: var(--panel); border: 1px solid var(--line); overflow-wrap: anywhere; white-space: pre-wrap; }
  .bub.me { align-self: flex-end; border-radius: 16px 16px 4px 16px; background: var(--cyan); color: var(--on-cyan); border-color: var(--cyan); }
  .bub small { display: block; opacity: .7; font-size: .72rem; margin-top: 2px; }
  .convo { width: 100%; text-align: left; background: var(--panel); color: var(--text); border: 1px solid var(--line); font-weight: 400; margin-bottom: 8px; padding: 12px 14px; }
  .convo b { display: block; } .convo span { color: var(--mute); font-size: .88rem; }
  .sticky { position: sticky; bottom: 0; background: var(--bg); padding-top: 8px; }
</style>
</head>
<body>

<div id="offline" class="hidden" role="status">You appear to be offline. Changes will not be saved.</div>

<section id="intro" class="hidden" role="dialog" aria-modal="true" aria-label="Welcome to BLEWCHAT">
  <div>
    <img class="mark" src="assets/logo.svg" alt="BLEWCHAT logo">
    <img class="word" src="assets/wordmark.svg" alt="BLEWCHAT">
    <p>&ldquo;also another eccentric build from the King&rdquo;</p>
    <button id="go" type="button">Enter BLEWCHAT</button>
  </div>
</section>

<section id="auth" class="hidden">
  <div class="card">
    <img src="assets/wordmark.svg" alt="BLEWCHAT">
    <form id="authForm" class="stack">
      <input class="f" id="username" placeholder="Username (a–z, 0–9, _ ; 3–24)" autocomplete="username" maxlength="24" data-m="up">
      <input class="f" id="display" placeholder="Display name (optional)" autocomplete="name" maxlength="50" data-m="up">
      <input class="f" id="email" type="email" placeholder="Email" autocomplete="email" data-m="in up forgot">
      <input class="f" id="password" type="password" placeholder="Password (8+ characters)" minlength="8" data-m="in up newpw">
      <button id="submit" type="submit"></button>
    </form>
    <p id="authNote" class="note" role="status"></p>
    <div class="links"><button type="button" id="swap" class="alt"></button><button type="button" id="forgot">Forgot password?</button></div>
  </div>
</section>

<section id="app" class="hidden">
  <header>
    <button class="logo" id="brand" type="button" aria-label="About BLEWCHAT: replay welcome screen"><img src="assets/wordmark.svg" alt="BLEWCHAT"></button>
    <span class="sp"></span>
    <button class="alt" id="signout" type="button">Sign out</button>
  </header>
  <nav><button id="tabFeed" type="button">Feed</button><button id="tabChats" type="button">Chats</button></nav>
  <main id="main"></main>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const h = (t, a = {}, ...c) => {
    const e = document.createElement(t);
    for (const [k, v] of Object.entries(a)) k.startsWith("on") ? (e[k] = v) : k === "class" ? (e.className = v) : e.setAttribute(k, v);
    e.append(...c.filter((x) => x != null)); return e;
  };
  const when = (t) => new Date(t).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  const KEY = "blewchat_intro_done";
  const store = { get: () => { try { return localStorage.getItem(KEY); } catch { return null; } }, set: () => { try { localStorage.setItem(KEY, "1"); } catch {} } };
  const show = (id) => ["auth", "app"].forEach((x) => $("#" + x).classList.toggle("hidden", x !== id));
  const note = (t, err) => { $("#authNote").textContent = t || ""; $("#authNote").className = "note" + (err ? " err" : ""); };

  /* ----- intro (first visit; replay by tapping the header wordmark) ----- */
  if (!store.get()) $("#intro").classList.remove("hidden");
  $("#go").onclick = () => { store.set(); $("#intro").classList.add("hidden"); };
  $("#brand").onclick = () => $("#intro").classList.remove("hidden");
  const net = () => $("#offline").classList.toggle("hidden", navigator.onLine);
  addEventListener("online", net); addEventListener("offline", net); net();

  const cfg = window.BLEWCHAT_CONFIG || {};
  if (!cfg.SUPABASE_URL || cfg.SUPABASE_URL.includes("YOUR-BLEWCHAT")) {
    show("auth"); $("#authForm").classList.add("hidden");
    note("Setup needed: add your new BLEWCHAT Supabase URL and anon key to config.js (see README).", true); return;
  }
  const sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  let me = null, recovering = false, channel = null, mode = "in";

  /* ----- authentication ----- */
  const labels = { in: "Sign in", up: "Create account", forgot: "Send reset link", newpw: "Set new password" };
  function setMode(m) {
    mode = m; note("");
    document.querySelectorAll(".f").forEach((i) => { const on = i.dataset.m.split(" ").includes(m); i.classList.toggle("hidden", !on); i.required = on && i.id !== "display"; });
    $("#submit").textContent = labels[m];
    $("#swap").textContent = m === "up" ? "Have an account? Sign in" : "New here? Create account";
    $("#swap").classList.toggle("hidden", m === "newpw"); $("#forgot").classList.toggle("hidden", m !== "in");
    $("#password").autocomplete = m === "in" ? "current-password" : "new-password";
  }
  $("#swap").onclick = () => setMode(mode === "up" ? "in" : "up");
  $("#forgot").onclick = () => setMode("forgot");
  setMode("in");

  $("#authForm").onsubmit = async (e) => {
    e.preventDefault();
    const email = $("#email").value.trim(), password = $("#password").value;
    $("#submit").disabled = true; note("Working…");
    try {
      if (mode === "up") {
        const username = $("#username").value.trim().toLowerCase();
        if (!/^[a-z0-9_]{3,24}$/.test(username)) throw new Error("Username: 3–24 characters, letters a–z, digits and underscores only.");
        const { data: free, error: chk } = await sb.rpc("username_available", { name: username });
        if (chk) throw chk; if (!free) throw new Error("That username is already taken.");
        const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.href.split("#")[0], data: { username, display_name: $("#display").value.trim() } } });
        if (error) throw error;
        note(data.session ? "Account created." : "Account created. Check your inbox to verify your email, then sign in.");
      } else if (mode === "forgot") {
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split("#")[0] });
        if (error) throw error; note("If that address is registered, a reset link is on its way.");
      } else if (mode === "newpw") {
        const { error } = await sb.auth.updateUser({ password });
        if (error) throw error; recovering = false; setMode("in"); const { data } = await sb.auth.getSession(); if (data.session) start(data.session.user);
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error; note("");
      }
    } catch (err) { note(/database error|duplicate|unique/i.test(err.message) ? "Could not create the account: that username or email may already be in use." : err.message, true); }
    $("#submit").disabled = false;
  };
  $("#signout").onclick = () => sb.auth.signOut();

  sb.auth.onAuthStateChange((ev, s) => {
    if (ev === "PASSWORD_RECOVERY") { recovering = true; $("#intro").classList.add("hidden"); show("auth"); setMode("newpw"); return; }
    if (recovering) return;
    if (s?.user) { if (!me || me.id !== s.user.id) start(s.user); } else stop();
  });

  async function start(user) {
    me = user; show("app"); tab("feed");
  }
  function stop() { me = null; if (channel) { sb.removeChannel(channel); channel = null; } show("auth"); setMode("in"); }

  /* ----- tabs ----- */
  const main = $("#main");
  function tab(t) {
    if (channel) { sb.removeChannel(channel); channel = null; }
    $("#tabFeed").className = t === "feed" ? "sel" : "alt"; $("#tabChats").className = t === "chats" ? "sel" : "alt";
    main.replaceChildren(); main.scrollTop = 0;
    t === "feed" ? feed() : chats();
  }
  $("#tabFeed").onclick = () => tab("feed"); $("#tabChats").onclick = () => tab("chats");

  /* ----- feed ----- */
  const PAGE = 15;
  function ytId(u) {
    try {
      const x = new URL(u), host = x.hostname.replace(/^(www|m)\./, ""); let id = null;
      if (host === "youtu.be") id = x.pathname.slice(1);
      else if (host === "youtube.com") id = x.searchParams.get("v") || (x.pathname.match(/^\/(?:shorts|embed)\/([\w-]{11})/) || [])[1];
      return /^[\w-]{11}$/.test(id || "") ? id : null;
    } catch { return null; }
  }
  function mediaEl(u) {
    const id = ytId(u), link = h("a", { href: u, target: "_blank", rel: "noopener noreferrer" }, "Open original link ↗");
    if (!id) { let host = u; try { host = new URL(u).hostname; } catch {} return h("div", { class: "meta" }, "🔗 ", link, " (" + host + ")"); }
    const box = h("div");
    const btn = h("button", { class: "media", type: "button", "aria-label": "Play video" },
      h("img", { src: `https://i.ytimg.com/vi/${id}/hqdefault.jpg`, alt: "Video thumbnail", loading: "lazy", onerror: function () { this.remove(); } }),
      h("span", { class: "play" }, "▶"));
    btn.onclick = () => btn.replaceWith(h("div", { class: "media" }, h("iframe", { src: `https://www.youtube-nocookie.com/embed/${id}?autoplay=1`, title: "Video player", allow: "autoplay; encrypted-media; picture-in-picture", allowfullscreen: "", referrerpolicy: "strict-origin-when-cross-origin" })));
    box.append(btn, h("div", { class: "meta" }, "If the video will not play, ", link));
    return box;
  }
  function feed() {
    const body = h("textarea", { placeholder: "What is on your mind?", maxlength: "2000", "aria-label": "Post text" });
    const link = h("input", { type: "url", placeholder: "Optional video/link URL (YouTube supported)", maxlength: "500" });
    const msg = h("p", { class: "note", role: "status" });
    const send = h("button", { type: "submit" }, "Post");
    const form = h("form", { class: "box stack" }, body, link, h("div", { class: "row" }, send), msg);
    const list = h("div"), more = h("button", { class: "alt", type: "button" }, "Load more");
    main.append(form, list, more);
    let page = 0;

    async function load(reset) {
      if (reset) { page = 0; list.replaceChildren(); }
      more.disabled = true; more.textContent = "Loading…";
      const { data, error } = await sb.from("posts")
        .select("id, body, link_url, created_at, user_id, profiles(username, display_name), likes(user_id)")
        .order("created_at", { ascending: false }).range(page * PAGE, page * PAGE + PAGE - 1);
      if (error) { more.disabled = false; more.textContent = "Could not load. Tap to retry"; return; }
      data.forEach((p) => list.append(postEl(p)));
      if (page === 0 && !data.length) list.append(h("p", { class: "empty" }, "No posts yet. Be the first to post."));
      page++; more.disabled = false; more.textContent = "Load more"; more.classList.toggle("hidden", data.length < PAGE);
    }

    function postEl(p) {
      const card = h("article", { class: "box" });
      const name = p.profiles?.display_name || p.profiles?.username || "unknown";
      let likes = p.likes.map((l) => l.user_id), liked = likes.includes(me.id);
      const likeBtn = h("button", { class: "alt", type: "button" });
      const paint = () => { likeBtn.textContent = (liked ? "♥ " : "♡ ") + likes.length; likeBtn.setAttribute("aria-pressed", liked); };
      paint();
      likeBtn.onclick = async () => {
        likeBtn.disabled = true;
        const { error } = liked ? await sb.from("likes").delete().match({ post_id: p.id, user_id: me.id }) : await sb.from("likes").insert({ post_id: p.id, user_id: me.id });
        if (!error) { liked = !liked; likes = liked ? [...likes, me.id] : likes.filter((x) => x !== me.id); paint(); }
        likeBtn.disabled = false;
      };
      const row = h("div", { class: "row" }, likeBtn);
      if (p.user_id === me.id) {
        row.append(h("button", { class: "alt danger", type: "button", onclick: async () => {
          if (!confirm("Delete this post?")) return;
          const { error } = await sb.from("posts").delete().eq("id", p.id);
          if (error) alert("Could not delete the post."); else card.replaceWith(h("p", { class: "empty" }, "Post deleted."));
        } }, "Delete"));
      }
      card.append(h("div", { class: "meta" }, h("b", {}, name), " @" + (p.profiles?.username || "?") + " · " + when(p.created_at)), h("div", { class: "text" }, p.body));
      if (p.link_url) card.append(mediaEl(p.link_url));
      card.append(row); return card;
    }

    more.onclick = () => load(false);
    form.onsubmit = async (e) => {
      e.preventDefault();
      const text = body.value.trim(), url = link.value.trim();
      if (!text) { msg.textContent = "Write something first."; msg.className = "note err"; return; }
      if (url && !/^https?:\/\//i.test(url)) { msg.textContent = "Links must start with http:// or https://"; msg.className = "note err"; return; }
      send.disabled = true; msg.textContent = "Posting…"; msg.className = "note";
      const { error } = await sb.from("posts").insert({ user_id: me.id, body: text, link_url: url || null });
      send.disabled = false;
      if (error) { msg.textContent = "Could not post. Please try again."; msg.className = "note err"; return; }
      body.value = ""; link.value = ""; msg.textContent = ""; load(true);
    };
    load(true);
  }

  /* ----- private messages (direct: sender -> recipient) ----- */
  async function chats() {
    const nameIn = h("input", { placeholder: "Start a chat: enter a username", maxlength: "24", "aria-label": "Username to message" });
    const msg = h("p", { class: "note", role: "status" });
    const form = h("form", { class: "box stack" }, nameIn, h("button", { type: "submit" }, "Open chat"), msg);
    const list = h("div", {}, h("p", { class: "empty" }, "Loading…"));
    main.append(form, list);

    form.onsubmit = async (e) => {
      e.preventDefault(); msg.className = "note"; msg.textContent = "";
      const u = nameIn.value.trim().toLowerCase().replace(/^@/, ""); if (!u) return;
      const { data: other } = await sb.from("profiles").select("id, username, display_name").eq("username", u).maybeSingle();
      if (!other) { msg.textContent = "No member with that username."; msg.className = "note err"; return; }
      if (other.id === me.id) { msg.textContent = "You cannot message yourself."; msg.className = "note err"; return; }
      thread(other);
    };

    const { data: msgs, error } = await sb.from("messages").select("sender_id, recipient_id, body, created_at")
      .or(`sender_id.eq.${me.id},recipient_id.eq.${me.id}`).order("created_at", { ascending: false }).limit(300);
    if (error) { list.replaceChildren(h("p", { class: "empty" }, "Could not load chats. Check your connection and try again.")); return; }
    if (!msgs.length) { list.replaceChildren(h("p", { class: "empty" }, "No chats yet. Enter a username above to say hello.")); return; }
    const last = new Map();
    msgs.forEach((m) => { const o = m.sender_id === me.id ? m.recipient_id : m.sender_id; if (!last.has(o)) last.set(o, m); });
    const { data: profs } = await sb.from("profiles").select("id, username, display_name").in("id", [...last.keys()]);
    list.replaceChildren(...[...last].map(([id, m]) => {
      const p = (profs || []).find((x) => x.id === id) || { id, username: "unknown" };
      return h("button", { class: "convo", type: "button", onclick: () => thread(p) },
        h("b", {}, p.display_name || p.username), h("span", {}, (m.sender_id === me.id ? "You: " : "") + m.body.slice(0, 60) + " · " + when(m.created_at)));
    }));
  }

  async function thread(other) {
    main.replaceChildren();
    const seen = new Set(), box = h("div", { class: "thread" }), msg = h("p", { class: "note", role: "status" });
    const input = h("input", { placeholder: "Message…", maxlength: "1000", "aria-label": "Message" });
    const send = h("button", { type: "submit" }, "Send");
    const blockBtn = h("button", { class: "alt danger", type: "button" }, "Block");
    let blocked = false;
    const paintBlock = () => { blockBtn.textContent = blocked ? "Unblock" : "Block"; };
    const pair = { blocker_id: me.id, blocked_id: other.id };
    const { data: b } = await sb.from("blocks").select("blocked_id").match(pair).maybeSingle();
    blocked = !!b; paintBlock();
    blockBtn.onclick = async () => {
      const { error } = blocked ? await sb.from("blocks").delete().match(pair) : await sb.from("blocks").insert(pair);
      if (error) { msg.textContent = "Could not update block."; msg.className = "note err"; }
      else { blocked = !blocked; paintBlock(); msg.textContent = blocked ? "Blocked. Neither of you can send or read messages here." : "Unblocked."; msg.className = "note"; }
    };
    const form = h("form", { class: "row sticky" }, h("div", { style: "flex:1" }, input), send);
    main.append(h("div", { class: "row", style: "margin-bottom:10px" }, h("button", { class: "alt", type: "button", onclick: () => tab("chats") }, "← Back"),
      h("b", { style: "flex:1" }, other.display_name || other.username), blockBtn), box, msg, form);

    const add = (m) => {
      if (seen.has(m.id)) return; seen.add(m.id);
      box.querySelector(".empty")?.remove();
      const near = main.scrollHeight - main.scrollTop - main.clientHeight < 140;
      box.append(h("div", { class: "bub" + (m.sender_id === me.id ? " me" : "") }, m.body, h("small", {}, when(m.created_at))));
      if (near || m.sender_id === me.id) main.scrollTop = main.scrollHeight;
    };
    const { data, error } = await sb.from("messages").select("id, body, sender_id, created_at")
      .or(`and(sender_id.eq.${me.id},recipient_id.eq.${other.id}),and(sender_id.eq.${other.id},recipient_id.eq.${me.id})`)
      .order("created_at", { ascending: false }).limit(100);
    if (error) { msg.textContent = "Could not load messages."; msg.className = "note err"; }
    else if (!data.length) box.append(h("p", { class: "empty" }, "Say hello."));
    else data.reverse().forEach(add);
    channel = sb.channel("dm:" + me.id)
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: `recipient_id=eq.${me.id}` }, (p) => { if (p.new.sender_id === other.id) add(p.new); })
      .subscribe();

    form.onsubmit = async (e) => {
      e.preventDefault(); const body = input.value.trim(); if (!body) return;
      send.disabled = true;
      const { data: m, error: err } = await sb.from("messages").insert({ sender_id: me.id, recipient_id: other.id, body }).select("id, body, sender_id, created_at").single();
      send.disabled = false;
      if (err) { msg.textContent = "Message not sent. This chat may be unavailable."; msg.className = "note err"; return; }
      input.value = ""; msg.textContent = ""; add(m);
    };
  }
})();
</script>
</body>
</html>
